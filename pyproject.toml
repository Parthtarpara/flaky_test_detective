[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flaky-test-detective"
version = "0.0.1"
description = "Diagnoses WHY a test is flaky by running controlled experiments."
requires-python = ">=3.12"
dependencies = ["pytest>=8"]

[project.optional-dependencies]
dev = ["ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]